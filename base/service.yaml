# manifests/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: argo-test2 # Сервис должен быть в том же неймспейсе
spec:
  type: NodePort
  selector:
    app: nginx # Сервис будет направлять трафик на поды с меткой app: nginx
  ports:
    - protocol: TCP
      port: 80       # Порт, на котором сервис будет доступен внутри кластера
      targetPort: 80 # Порт, на котором работает контейнер
      # NodePort будет назначен автоматически в диапазоне 30000-32767
